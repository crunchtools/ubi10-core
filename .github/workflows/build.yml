name: Build, Test, and Push Container Image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  repository_dispatch:
    types: [parent-image-updated]
  workflow_dispatch:
env:
  REGISTRY: quay.io
  IMAGE_NAME: crunchtools/ubi10-core
  GHCR_IMAGE: ghcr.io/crunchtools/ubi10-core

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as tarball
        run: docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest -o /tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: /tmp/image.tar
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: container-image
          path: /tmp

      - name: Install Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman

      - name: Load image
        run: podman load -i /tmp/image.tar

      - name: Start container
        run: |
          podman run -d --name test-container \
            --systemd=always \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Wait for systemd
        run: |
          echo "Waiting for systemd to boot..."
          for i in $(seq 1 30); do
            STATE=$(podman exec test-container systemctl is-system-running 2>/dev/null || true)
            if [ "$STATE" = "running" ] || [ "$STATE" = "degraded" ]; then
              echo "systemd ready after ${i}s (state: $STATE)"
              break
            fi
            sleep 1
          done

      - name: Run smoke tests
        run: |
          podman cp tests/smoke-test.sh test-container:/tmp/smoke-test.sh
          podman exec test-container chmod +x /tmp/smoke-test.sh
          podman exec test-container /tmp/smoke-test.sh

      - name: Cleanup
        if: always()
        run: podman rm -f test-container

  build-and-push-quay:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: container-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Push image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          SHA_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$(echo ${{ github.sha }} | cut -c1-7)"
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest "$SHA_TAG" || true
          docker push "$SHA_TAG" || true

          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:"$VERSION"
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:"$VERSION"
          fi

      - name: Trigger downstream rebuilds
        env:
          GH_TOKEN: ${{ secrets.CRUNCHTOOLS_DISPATCH_TOKEN }}
        run: |
          for repo in ubi10-httpd factory postiz rotv immich acquacotta; do
            gh api repos/crunchtools/$repo/dispatches \
              -f event_type=parent-image-updated || true
          done

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  validate-constitution:
    name: Constitution Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: crunchtools/constitution
          path: .constitution

      - name: Validate constitution
        run: python3 .constitution/validate-constitution.py .specify/memory/constitution.md --verbose

  build-and-push-ghcr:
    runs-on: ubuntu-latest
    needs: build-and-push-quay
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      # Reuse the tarball the test job already verified rather than rebuilding,
      # so Quay and GHCR carry the identical image rather than two builds that
      # merely started from the same commit.
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: container-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Tag and push to GHCR
        run: |
          SHA_TAG="$(echo ${{ github.sha }} | cut -c1-7)"
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.GHCR_IMAGE }}:latest
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.GHCR_IMAGE }}:"$SHA_TAG"
          docker push ${{ env.GHCR_IMAGE }}:latest
          docker push ${{ env.GHCR_IMAGE }}:"$SHA_TAG"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.GHCR_IMAGE }}:"$VERSION"
            docker push ${{ env.GHCR_IMAGE }}:"$VERSION"
          fi
