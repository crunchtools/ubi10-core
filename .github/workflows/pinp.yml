# SANDBOX (sdlc#135): can rootless podman run nested in a job container? Temporary.
name: pinp-spike
on:
  push: { branches: [sandbox/pinp] }
permissions: { contents: read }
jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        runner: [crunchtools-vmspike]
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/podman/stable:v5.6
      options: --device /dev/fuse --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt label=disable
    steps:
      - run: |
          printf 'podman:1:999\npodman:1001:32768\n' > /etc/subuid
          cp /etc/subuid /etc/subgid
          cat /proc/self/uid_map; uname -r
      - run: runuser -u podman -- env HOME=/home/podman podman info --format '{{.Store.GraphDriverName}} rootless={{.Host.Security.Rootless}}'
      - run: runuser -u podman -- env HOME=/home/podman podman run --rm docker.io/library/busybox:latest echo nested-run-ok
      - run: |
          d=$(mktemp -d); chmod 755 $d; printf 'FROM docker.io/library/busybox:latest\nRUN echo built > /x\n' > $d/Containerfile
          runuser -u podman -- env HOME=/home/podman sh -c "podman build -q -t spike $d && podman run --rm spike cat /x"
