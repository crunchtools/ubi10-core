# Forward this container's internal journal to syslog.crunchtools.com.
#
# Constitution XIII. When PID 1 is systemd, conmon only captures systemd's own
# console output — every service running *inside* the container logs to the
# container's private journal, which dies with the container and never reaches
# the host journal the central collector reads. This closes that gap.
#
# Plain-process containers need none of this: their stdout goes straight to
# conmon and the collector picks it up out of the host journal.
#
# This file deliberately loads no modules and sets no globals. The stock
# /etc/rsyslog.conf already loads imjournal and sets workDirectory, and rsyslog
# rejects the whole configuration if either is declared twice. All that is
# needed here is one extra destination for messages already being read.
#
# It is included from /etc/rsyslog.d/*.conf at line 26 of the stock config,
# before the local rules, and every message passes through every action — so
# forwarding happens in addition to the normal local logging, not instead of it.

# Send the container's real hostname rather than the short podman ID, so the
# collector files these under a name that matches the service.
$PreserveFQDN on

# 10.88.0.1 is the podman bridge gateway, where the collector publishes 514.
# Containers on the crunchtools network should target "syslog" instead, and
# host-network containers 127.0.0.1.
#
# resumeRetryCount=-1 with a disk-assisted queue means a collector restart backs
# logs up here instead of dropping them on the floor, and saveOnShutdown carries
# that backlog across a container restart. maxDiskSpace bounds the damage if the
# collector stays down for a long time.
action(type="omfwd"
       target="10.88.0.1"
       port="514"
       protocol="tcp"
       action.resumeRetryCount="-1"
       action.resumeInterval="10"
       queue.type="linkedList"
       queue.filename="fwd_collector"
       queue.maxDiskSpace="64m"
       queue.saveOnShutdown="on")
